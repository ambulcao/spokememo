services:
  postgres:
    image: postgres:16-alpine
    container_name: spokememo-postgres
    environment:
      - POSTGRES_DB=meetmemo
      - POSTGRES_USER=meetmemo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:z
    networks:
      - spokememo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetmemo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  spokememo-backend:
    image: ghcr.io/notyusheng/meetmemo-backend:${IMAGE_TAG:-latest}
    container_name: spokememo-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audiofiles:/app/audiofiles
      - logs:/app/logs
      - transcripts:/app/transcripts
      - summary:/app/summary
      - exports:/app/exports
      - whisper_cache:/root/.cache/whisper
      - huggingface_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    # GPU via NVIDIA CDI (Podman and Docker with nvidia-container-toolkit).
    # Comment this device out and set HARDWARE_PROFILE=cpu for CPU-only.
    devices:
      - nvidia.com/gpu=all
    environment:
      - HF_TOKEN=${HF_TOKEN:-CHANGEME}
      - LLM_API_URL=${LLM_API_URL:-CHANGEME}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-CHANGEME}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - TIMEZONE_OFFSET=${TIMEZONE_OFFSET:-+8}
      # Hardware profile + ML overrides. Passed through only when set in the
      # environment (bare form), so an unset value lets HARDWARE_PROFILE's
      # auto-detection/defaults take effect instead of a hardcoded override.
      - HARDWARE_PROFILE
      - GPU_MEMORY_FRACTION
      - WHISPER_MODEL_NAME
      - COMPUTE_TYPE
      - PYANNOTE_MODEL_NAME
      - DEVICE
      - DATABASE_URL=postgresql://meetmemo:${POSTGRES_PASSWORD:-changeme}@postgres:5432/meetmemo
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      # Required for PyAnnote models - newer PyTorch defaults to weights_only=True for security,
      # but PyAnnote's pickled models require full unpickling. Only use with trusted model sources.
      - TORCH_LOAD_WEIGHTS_ONLY=0
    networks:
      - spokememo-network
    depends_on:
      postgres:
        condition: service_healthy

  spokememo-frontend:
    image: ghcr.io/notyusheng/meetmemo-frontend:${IMAGE_TAG:-latest}
    container_name: spokememo-frontend
    # No external ports - accessed via nginx
    depends_on:
      - spokememo-backend
    networks:
      - spokememo-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: spokememo-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - spokememo-frontend
      - spokememo-backend
    networks:
      - spokememo-network
    restart: unless-stopped

volumes:
  postgres_data:
  audiofiles:
  logs:
  transcripts:
  whisper_cache:
  huggingface_cache:
  torch_cache:
  summary:
  exports:

networks:
  spokememo-network:
    name: spokememo-network
    driver: bridge